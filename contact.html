<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — FixMyArea</title>
  <meta name="description" content="Get in touch with the FixMyArea demonstration team.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#536B4F',
              hover: '#435740',
              soft: '#DDE6D8',
            },
            canvas: '#F7F6F2',
            surface: '#FFFFFF',
            borderLight: '#E7E5E0',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F7F6F2;
      color: #202020;
    }
  </style>
</head>
<body class="min-h-full flex flex-col font-sans antialiased selection:bg-[#DDE6D8] selection:text-[#202020]">

  <!-- Shared Header Container -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
    
    <div class="text-center mb-10">
      <span class="inline-flex items-center px-3 py-1 rounded-full bg-[#DDE6D8] text-xs font-semibold text-[#435740] mb-3">
        Reach Out
      </span>
      <h1 class="text-3xl sm:text-4xl font-bold text-[#202020] tracking-tight mb-3">
        Have a question or feedback?
      </h1>
      <p class="text-sm sm:text-base text-[#737373] max-w-md mx-auto">
        Leave a note for the project team. This is an interactive demo simulation.
      </p>
    </div>

    <!-- Contact Form Container -->
    <div class="bg-white border border-[#E7E5E0] rounded-2xl p-6 sm:p-10 shadow-sm">
      
      <form id="contact-form" class="space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="contact-name" class="block text-xs font-semibold uppercase tracking-wider text-[#555] mb-1.5">
              Your Name <span class="text-red-500">*</span>
            </label>
            <input type="text" id="contact-name" required placeholder="Jane Doe"
                   class="w-full px-3.5 py-2.5 bg-white border border-[#E7E5E0] rounded-xl text-sm text-[#202020] placeholder-[#888] focus:outline-none focus:ring-2 focus:ring-[#536B4F]">
          </div>

          <div>
            <label for="contact-email" class="block text-xs font-semibold uppercase tracking-wider text-[#555] mb-1.5">
              Email Address <span class="text-red-500">*</span>
            </label>
            <input type="email" id="contact-email" required placeholder="you@example.com"
                   class="w-full px-3.5 py-2.5 bg-white border border-[#E7E5E0] rounded-xl text-sm text-[#202020] placeholder-[#888] focus:outline-none focus:ring-2 focus:ring-[#536B4F]">
          </div>
        </div>

        <div>
          <label for="contact-subject" class="block text-xs font-semibold uppercase tracking-wider text-[#555] mb-1.5">
            Subject <span class="text-red-500">*</span>
          </label>
          <input type="text" id="contact-subject" required placeholder="General feedback, feature inquiry..."
                 class="w-full px-3.5 py-2.5 bg-white border border-[#E7E5E0] rounded-xl text-sm text-[#202020] placeholder-[#888] focus:outline-none focus:ring-2 focus:ring-[#536B4F]">
        </div>

        <div>
          <label for="contact-message" class="block text-xs font-semibold uppercase tracking-wider text-[#555] mb-1.5">
            Message <span class="text-red-500">*</span>
          </label>
          <textarea id="contact-message" required rows="4" placeholder="How can we help or improve the FixMyArea concept?"
                    class="w-full px-3.5 py-2.5 bg-white border border-[#E7E5E0] rounded-xl text-sm text-[#202020] placeholder-[#888] focus:outline-none focus:ring-2 focus:ring-[#536B4F]"></textarea>
        </div>

        <div>
          <button type="submit" 
                  class="w-full sm:w-auto px-6 py-3 rounded-full text-sm font-medium text-white bg-[#536B4F] hover:bg-[#435740] active:scale-[0.98] shadow-sm transition-all">
            Send Demo Message
          </button>
        </div>
      </form>

      <!-- Simulated Success State -->
      <div id="contact-success" class="hidden text-center py-8 space-y-3">
        <div class="w-12 h-12 rounded-full bg-[#DDE6D8] text-[#536B4F] flex items-center justify-center mx-auto">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
        </div>
        <h3 class="text-xl font-bold text-[#202020]">Message Received!</h3>
        <p class="text-sm text-[#737373] max-w-sm mx-auto">
          Thank you for reaching out. As this is a client-side frontend demo, messages are processed in-memory for testing purposes.
        </p>
        <div class="pt-3">
          <button id="reset-contact-btn" class="text-xs font-medium text-[#536B4F] underline">
            Send another message
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- Shared Footer Container -->
  <div id="site-footer"></div>

  <script type="module">
    import { initLayout } from './js/layout.js';
    document.addEventListener("DOMContentLoaded", () => {
      initLayout("contact");

      const form = document.getElementById("contact-form");
      const success = document.getElementById("contact-success");
      const resetBtn = document.getElementById("reset-contact-btn");

      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          form.classList.add("hidden");
          success.classList.remove("hidden");
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          form.reset();
          success.classList.add("hidden");
          form.classList.remove("hidden");
        });
      }
    });
  </script>
</body>
</html>
