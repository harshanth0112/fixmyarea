<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixMyArea - My Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(180deg, #f8fbff 0%, #edf5ff 100%);
      }
      .soft-panel {
        background: rgba(255,255,255,0.88);
        border: 1px solid rgba(148, 163, 184, 0.12);
        backdrop-filter: blur(8px);
      }
      .nav-link {
        position: relative;
        transition: color 0.2s ease;
      }
      .nav-link:hover {
        color: #dbeafe;
      }
      .nav-link.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -8px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
      }
      .report-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .report-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 16px 30px rgba(59,130,246,0.09);
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800 min-h-screen">
    <nav class="bg-gradient-to-r from-blue-700 via-blue-600 to-cyan-600 text-white shadow-lg">
      <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">
        <a href="../../index.html" class="text-2xl font-bold tracking-tight">FixMyArea</a>
        <div class="hidden md:flex gap-6 text-sm font-medium">
          <a href="../../index.html" class="nav-link relative hover:text-blue-100">Home</a>
          <a href="../../pages/dev1/dashboard.html" class="nav-link relative hover:text-blue-100">Dashboard</a>
          <a href="../../pages/dev2/report.html" class="nav-link relative hover:text-blue-100">Report Issue</a>
          <a href="issues.html" class="nav-link relative hover:text-blue-100">Explore Issues</a>
          <a href="my-reports.html" class="nav-link active relative font-bold">My Reports</a>
          <a href="../../pages/dev4/admin.html" class="nav-link relative hover:text-blue-100">Admin</a>
        </div>
      </div>
    </nav>

    <main class="max-w-6xl mx-auto px-5 py-10">
      <div class="soft-panel rounded-3xl p-6 md:p-8 mb-8 border-l-4 border-blue-500 shadow-sm">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-5">
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">Your activity</p>
            <h1 class="mt-3 text-3xl md:text-4xl font-black text-gray-900">My Reports</h1>
            <p class="mt-2 text-gray-600">Track the issues you have reported.</p>
          </div>
          <div class="rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-500 text-white px-5 py-4 shadow-md min-w-[220px]">
            <p class="text-xs uppercase tracking-wide text-blue-100">Logged in as</p>
            <h2 class="mt-2 text-xl font-bold">Demo Citizen</h2>
          </div>
        </div>
      </div>

      <div id="myReportsContainer" class="space-y-5"></div>

      <div id="myReportsEmpty" class="hidden soft-panel rounded-2xl p-12 text-center shadow-sm">
        <div class="text-5xl mb-4">📋</div>
        <h3 class="text-xl font-bold text-gray-900">No reports yet</h3>
        <p class="text-gray-500 mt-2">You have not submitted any reports.</p>
        <a href="../../pages/dev2/report.html" class="inline-block mt-5 bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 shadow-sm">Report an Issue</a>
      </div>
    </main>

    <script src="../../js/dev3/script.js"></script>
    <script src="../../js/dev3/my-reports.js"></script>
  </body>
</html>
