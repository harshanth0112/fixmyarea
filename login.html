<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FixMyArea</title>
  <meta name="description" content="Sign in or register to the FixMyArea civic issue reporting platform.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#536B4F', hover: '#435740', soft: '#DDE6D8' },
            canvas: '#F7F6F2',
            surface: '#FFFFFF',
            borderLight: '#E7E5E0',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #F7F6F2; color: #202020; }

    /* Slide-in transition for user form panel */
    #user-form-panel {
      transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
    }
    #user-form-panel.open {
      max-height: 900px;
      opacity: 1;
    }

    /* Password eye toggle */
    .input-field {
      width: 100%;
      padding: 0.55rem 0.875rem;
      background: #fff;
      border: 1px solid #E7E5E0;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      color: #202020;
      outline: none;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .input-field:focus {
      border-color: #536B4F;
      box-shadow: 0 0 0 3px rgba(83,107,79,0.12);
    }
    .input-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-bottom: 0.3rem;
    }
    .field-wrap { position: relative; }
    .eye-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      cursor: pointer;
    }
    .section-divider {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      border-bottom: 1px solid #E7E5E0;
      padding-bottom: 0.4rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body class="min-h-full flex flex-col font-sans antialiased">

  <!-- Shared Header Target -->
  <div id="site-header"></div>

  <!-- Main Login Content -->
  <main class="flex-grow flex items-start justify-center px-4 sm:px-6 lg:px-8 py-10">
    <div class="max-w-md w-full">

      <!-- Card -->
      <div class="bg-white border border-[#E7E5E0] rounded-3xl p-8 sm:p-10 shadow-sm">
        
        <!-- Header -->
        <div class="text-center mb-8">
          <div class="w-12 h-12 rounded-2xl bg-[#DDE6D8] text-[#536B4F] flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </div>
          <h1 class="text-2xl font-bold text-[#202020] tracking-tight">Sign in to FixMyArea</h1>
          <p class="text-xs text-[#737373] mt-1.5">Choose your access role to get started</p>
        </div>

        <!-- Role Selection Cards -->
        <div class="space-y-3 mb-5" id="role-cards">
          <a href="user-login.html" class="block w-full text-left p-4 rounded-2xl border border-[#E7E5E0] hover:border-[#536B4F] hover:bg-[#FAF9F5] transition-all group">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#EBF5EA] text-[#2D6A28] flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <div>
                  <div class="text-sm font-semibold text-[#202020] group-hover:text-[#536B4F]">Citizen Login</div>
                  <div class="text-xs text-[#737373]">Submit &amp; track neighborhood reports</div>
                </div>
              </div>
              <svg class="w-4 h-4 text-[#536B4F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5-5 5M5 12h12"/></svg>
            </div>
          </a>

          <a href="admin-login.html" class="block w-full text-left p-4 rounded-2xl border border-[#E7E5E0] hover:border-[#536B4F] hover:bg-[#FAF9F5] transition-all group">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#FEF3C7] text-[#B45309] flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </div>
                <div>
                  <div class="text-sm font-semibold text-[#202020] group-hover:text-[#536B4F]">Admin Login</div>
                  <div class="text-xs text-[#737373]">Moderation, stats &amp; updates</div>
                </div>
              </div>
              <svg class="w-4 h-4 text-[#536B4F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5-5 5M5 12h12"/></svg>
            </div>
          </a>

          <a href="index.html" class="block w-full text-left p-4 rounded-2xl border border-[#E7E5E0] hover:border-[#536B4F] hover:bg-[#FAF9F5] transition-all group">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#F0EFEB] text-[#666] flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </div>
                <div>
                  <div class="text-sm font-semibold text-[#202020] group-hover:text-[#536B4F]">Continue as Guest</div>
                  <div class="text-xs text-[#737373]">Browse public issues anonymously</div>
                </div>
              </div>
              <svg class="w-4 h-4 text-[#536B4F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5-5 5M5 12h12"/></svg>
            </div>
          </a>
        </div>

        <div class="p-3.5 rounded-2xl bg-[#F7F6F2] border border-[#E7E5E0] text-center text-xs text-[#737373]">
          🔒 <strong>Citizen login</strong> goes to a separate account page. <strong>Admin</strong> opens the moderation login.
        </div>
      </div>
    </div>
  </main>

  <!-- Shared Footer Target -->
  <div id="site-footer"></div>

  <script type="module">
    import { initLayout } from './js/layout.js';

    document.addEventListener("DOMContentLoaded", () => {
      initLayout("login");
    });
  </script>
</body>
</html>
